<script>
(function(){
function deslizar(){
 document.querySelectorAll('.desliza[data-elegida]').forEach(function(d){
  var p=d.querySelector('.pest'),t=p.children[+d.getAttribute('data-elegida')];
  var ancho=d.getBoundingClientRect().width,fila=p.getBoundingClientRect().width+32;
  var tb=t.getBoundingClientRect(),db=d.getBoundingClientRect();
  var izq=tb.left-db.left,centro=izq+tb.width/2-ancho/2;
  var mx=Math.max(0,fila-ancho),x=Math.max(0,Math.min(mx,centro));
  p.style.transform='translateX(-'+Math.round(x)+'px)';
  if(x>0){var a=document.createElement('span');a.className='desvanece desvanece-izq';a.setAttribute('aria-hidden','true');d.appendChild(a);}
  if(x<mx){var b=document.createElement('span');b.className='desvanece desvanece-der';b.setAttribute('aria-hidden','true');d.appendChild(b);}
  d.removeAttribute('data-elegida');
 });
 document.body.setAttribute('data-deslizado','1');
}
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(deslizar);}else{window.addEventListener('load',deslizar);}
})();
