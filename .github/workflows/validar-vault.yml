# Valida el vault en cada pull request y en cada push a main.
# Qué la hace fallar: herramientas/validar-vault/validar.py (frontmatter, enlaces rotos, IDs repetidos).
name: Validar vault

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontmatter, enlaces e identificadores
        run: python herramientas/validar-vault/validar.py
